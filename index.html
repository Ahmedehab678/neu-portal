@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--tx:#e8ecf7;--mut:#98a3bf;--pri:#6c93ff;--pri-t:#0f1524;--ok:#4cd2a0;--okb:#12352b;--warn:#f0b35a;--warnb:#3a2c12;--bd:#2a3555;--bad:#ff8b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--tx:#e8ecf7;--mut:#98a3bf;--pri:#6c93ff;--pri-t:#0f1524;--ok:#4cd2a0;--okb:#12352b;--warn:#f0b35a;--warnb:#3a2c12;--bd:#2a3555;--bad:#ff8b80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer}
button.p{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}

button.d{color:var(--bad)}

label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:3px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--okb);color:var(--ok)}
.badge.b{background:var(--warnb);color:var(--warn)}
.mut{color:var(--mut);font-size:.9rem}
.day{font-weight:700;margin:14px 0 6px;color:var(--pri)}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
a.btn{display:inline-block;background:var(--ok);color:var(--pri-t);padding:7px 14px;border-radius:10px;text-decoration:none}
.chat{height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0}

.m small{display:block;opacity:.75;font-size:.72rem}
.empty{text-align:center;color:var(--mut);padding:20px}
.note{background:var(--warnb);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:.88rem}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 85% -5%,rgba(201,122,34,.20),transparent 60%),radial-gradient(700px 500px at 0% 25%,rgba(14,83,150,.38),transparent 60%),radial-gradient(600px 500px at 100% 100%,rgba(214,163,90,.22),transparent 60%);animation:drift 14s ease-in-out infinite alternate}

.card,.slot,.hero{animation:rise .5s both}

<script>
/* ===== طبقة الاتصال بالخادم: تحلّ محل claude.use('db' / 'assets' / 'downloads') ===== */
(function(){
const api=async(url,body,method)=>{
  const o={method:method||(body===undefined?'GET':'POST'),credentials:'same-origin',headers:{}};
  if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  let r;try{r=await fetch(url,o)}catch(e){return{ok:false,status:0,error:'تعذر الاتصال بالخادم'}}
  let j={};try{j=await r.json()}catch(e){}
  return Object.assign({},j,{ok:r.ok&&j.ok!==false,status:r.status});
};
window.api=api;
const subs=new Set();let es=null;
const fail=r=>{const e=new Error(r.error||'تعذر تنفيذ الطلب');e.code=r.status===413?'too_large':r.status===429?'rate_limited':String(r.status);return e};
const rpc=(op,path,data)=>api('/api/db',{op,path,data});
const chk=async p=>{const r=await p;if(!r.ok)throw fail(r);return r};
function connect(){
  if(es){es.close();es=null}
  es=new EventSource('/api/stream');
  es.onmessage=e=>subs.forEach(s=>{if(s.path===e.data)s.pull()});
  let first=true;es.onopen=()=>{if(!first)subs.forEach(s=>s.pull());first=false};
}
function Q(path){return{
  orderBy(){return Q(path)},
  onSnapshot(cb,errCb){
    let tm=null,alive=true;
    const run=async()=>{
      const r=await rpc('list',path);if(!alive)return;
      if(r.status===401){cb({docs:[]});return}
      if(!r.ok){errCb&&errCb(new Error(r.error));return}
      cb({docs:r.docs.map(d=>({id:d.id,data:()=>d.data}))});
    };
    const s={path,pull(){clearTimeout(tm);tm=setTimeout(run,200)}};
    subs.add(s);run();return()=>{alive=false;subs.delete(s)};
  },
  add:async d=>({id:(await chk(rpc('add',path,d))).id})
}}
const D=path=>({
  get:async()=>{const r=await chk(rpc('get',path));return{exists:!!r.exists,data:()=>r.data}},
  set:d=>chk(rpc('set',path,d)),update:d=>chk(rpc('update',path,d)),delete:()=>chk(rpc('delete',path))
});
const dbx={collection:Q,doc:D};
const assets={
  async upload(blob){
    let r;try{r=await fetch('/api/upload',{method:'POST',credentials:'same-origin',headers:{'Content-Type':blob.type},body:blob})}catch(e){throw fail({status:0})}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw fail({status:r.status,error:j.error});return j;
  },
  delete:id=>api('/api/upload/'+encodeURIComponent(id),undefined,'DELETE')
};
const downloads={async save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}};
window.claude={
  async use(n){return n==='db'?dbx:n==='assets'?assets:n==='downloads'?downloads:null},
  refresh(){connect();subs.forEach(s=>s.pull())}
};
connect();
})();
</script>

let svcs=[],tickets=[],sdept='affairs',qOff=0,editSvc='',notified=new Set(),mats=[],likes=[],mq='',mtype='',msub='',msort='new',upOpen=false,authMode='login',tries=0,lockUntil=0,isOwner=false,courses=[],reviews=[],cq='',csort='rate',cOpen=null,showAdd=false,db=null,slots=[],me={role:'',name:'',id:''},tab='',advisorFilter='',openChat=null,unChat=null,loaded=false,err='';

async function syncMe(){
  const r=await api('/api/me');
  if(r.user){me={...r.user,auth:true};save()}
  else if(me.auth&&r.status!==0){me={role:'',name:'',id:'u'+Math.random().toString(36).slice(2,10),auth:false};save()}
  isOwner=!!r.isOwner;
}
async function init(){
  await syncMe();await loadCfg();render();
  try{
    const c=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);
    db=c;
  }catch(e){db=null}
  if(!db){err='تعذر الاتصال بالخادم. حدّث الصفحة وحاول مرة أخرى.';loaded=true;render();return}
  claude.refresh();
  db.collection('slots').onSnapshot(q=>{
    slots=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.startMs-b.startMs);
    loaded=true;if(!(openChat&&document.activeElement&&document.activeElement.id==='msg'))render();
  },e=>{err='خطأ في تحميل المواعيد';loaded=true;render()});
  db.collection('courses').onSnapshot(q=>{courses=q.docs.map(d=>({id:d.id,...d.data()}));if(!typing())render()});
  db.collection('services').onSnapshot(q=>{svcs=q.docs.map(d=>({id:d.id,...d.data()}));if(me.auth&&!typing()&&['svc','cat','home'].includes(tab))render()});
  db.collection('tickets').onSnapshot(q=>{
    const old=new Map(tickets.map(t=>[t.id,t.status]));
    tickets=q.docs.map(d=>({id:d.id,...d.data()}));
    if(me.auth&&me.role==='student')tickets.forEach(t=>{if(t.uid!==me.id||!old.has(t.id))return;
      if(t.status==='serving'&&old.get(t.id)!=='serving')toast('🔔 دورك الآن! توجّه إلى '+(DEPTS[t.dept]||{n:''}).n);
      else if(t.status==='waiting'&&t.day===dayKey(0)&&aheadOf(t).length<=2&&!notified.has(t.id)){notified.add(t.id);toast('⏳ اقترب دورك، تجهّز')}});
    if(me.auth&&!typing()&&['svc','cat','home'].includes(tab))render()});
  db.collection('materials').onSnapshot(q=>{mats=q.docs.map(d=>({id:d.id,...d.data()}));if(me.auth&&tab==='lib')drawMats()});
  db.collection('likes').onSnapshot(q=>{likes=q.docs.map(d=>d.data());if(me.auth&&tab==='lib')drawMats()});
  db.collection('reviews').onSnapshot(q=>{reviews=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);if(!typing())render()});
}

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function addView(){
  return `<div class="card"><h2>إضافة مواعيد متاحة</h2><p class="mut">يمكنك إضافة عدة مواعيد متتالية دفعة واحدة، والنظام يمنع تداخل مواعيدك.</p>
  <div class="row"><label>التاريخ<input type="date" id="d" min="${todayStr()}" value="${todayStr()}"></label>

  <label>مدة الموعد<select id="du"><option value="15">15 دقيقة</option><option value="20" selected>20 دقيقة</option><option value="30">30 دقيقة</option><option value="45">45 دقيقة</option></select></label>

  <br><button class="p" onclick="addSlots()">إضافة</button></div>`;
}
async function addSlots(){
  const d=$('#d').value,t=$('#t').value,du=+$('#du').value,n=Math.max(1,Math.min(12,+$('#n').value||1));
  if(!d||!t){alert('أكمل التاريخ والوقت');return}
  const base=new Date(d+'T'+t).getTime();if(base<Date.now()){alert('اختر وقتاً في المستقبل');return}
  const mine=slots.filter(s=>s.advisorId===me.id);let added=0,skipped=0;
  for(let i=0;i<n;i++){
    const s={advisorId:me.id,advisorName:me.name,startMs:base+i*du*60000,dur:du,status:'open',studentId:'',studentName:'',topic:''};
    if(mine.some(o=>overlap(o,s))){skipped++;continue}
    try{await db.collection('slots').add(s);added++}catch(e){err='لا تملك صلاحية الإضافة';break}
  }
  alert(`تمت إضافة ${added} موعد`+(skipped?` وتخطّي ${skipped} لتداخلها`:''));tab='mine';render();
}
function group(list){
  let h='',last='';
  for(const s of list){const dn=fmtDay(s.startMs);if(dn!==last){h+=`<div class="day">${dn}</div>`;last=dn}h+=slotRow(s)}
  return h;
}
function slotRow(s){
  const adv=me.role==='advisor',booked=s.status==='booked',past=end(s)<Date.now();
  let info=`<div><b class="tm">${fmtT(s.startMs)}</b> <span class="mut">(${s.dur} د)</span> ${adv?'':`· ${esc(s.advisorName)}`}`;
  if(booked)info+=`<br><span class="mut">${adv?'الطالب: '+esc(s.studentName):''} ${s.topic?'· الموضوع: '+esc(s.topic):''}</span>`;
  info+='</div>';
  let act='';
  const mineStu=booked&&s.studentId===me.id;
  if(booked||adv)act+=`<span class="badge ${booked?'b':''}">${booked?'محجوز':'متاح'}</span>`;
  if(booked&&!past&&(adv||mineStu))act+=`<button class="p" onclick="openSession('${s.id}')">دخول الجلسة</button><button class="d" onclick="cancel('${s.id}')">إلغاء الحجز</button>`;
  if(adv&&!booked)act+=`<button class="d" onclick="del('${s.id}')">حذف</button>`;
  if(!adv&&!booked&&!past)act+=`<button class="p" onclick="book('${s.id}')">احجز</button>`;
  return `<div class="slot ${booked?'bk':''}">${info}<div class="row">${act}</div></div>`;
}
function advMine(){

async function book(id){
  const s=slots.find(x=>x.id===id);if(!s)return;
  const mineB=slots.filter(x=>x.studentId===me.id&&x.status==='booked'&&end(x)>Date.now());
  if(mineB.some(o=>overlap(o,s))){alert('لديك حجز آخر في نفس الوقت');return}
  const topic=await ask('موضوع الاستشارة (مثال: تسجيل المواد، خطة التخرج)',true);if(topic===null)return;
  try{
    const ref=db.doc('slots/'+id),cur=await ref.get();
    if(!cur.exists||cur.data().status!=='open'){alert('عذراً، تم حجز هذا الموعد للتو. اختر موعداً آخر.');return}
    await ref.update({status:'booked',studentId:me.id,studentName:me.name,topic:topic.trim()});
    tab='mine';render();
  }catch(e){alert('تعذر الحجز، حاول مرة أخرى')}
}
async function cancel(id){
  if(await ask('هل تريد إلغاء هذا الحجز؟')===null)return;
  try{await db.doc('slots/'+id).update({status:'open',studentId:'',studentName:'',topic:''});if(openChat===id)closeSession()}catch(e){alert('تعذر الإلغاء')}
}
async function del(id){if(await ask('حذف هذا الموعد؟')===null)return;try{await db.doc('slots/'+id).delete()}catch(e){alert('تعذر الحذف')}}

function stat(id){const r=reviews.filter(x=>x.courseId===id),n=r.length,av=k=>n?r.reduce((a,x)=>a+(+x[k]||0),0)/n:0;return{n,r,st:av('stars'),df:av('diff'),wk:av('work'),rec:n?Math.round(r.filter(x=>x.rec).length/n*100):0}}

const dq=(dept,day)=>tickets.filter(t=>t.dept===dept&&t.day===day).sort(tkLess);
const numOf=t=>dq(t.dept,t.day).findIndex(x=>x.id===t.id)+1;

  const q=dq(sdept,td),w=q.filter(x=>x.status==='waiting').length,cur=q.find(x=>x.status==='serving'),cr=w<8?['خفيف','🟢']:w<20?['متوسط','🟡']:['مرتفع','🔴'];

function svcCard(s,stu){

  return `<div class='card'><div class='row sp'><h3 style='margin:0'>${esc(s.name)}</h3><span class='row'>${s.sample?`<span class='badge b'>مثال استرشادي</span>`:''}<span class='badge'>≈ ${s.mins||(DEPTS[s.dept]||{avg:5}).avg} دقيقة</span></span></div>${docs.length?`<div class='mut' style='margin-top:8px'>📄 الأوراق المطلوبة (${n}/${docs.length} جاهزة)</div>${docs.map((d,i)=>`<label class='ck'><input type='checkbox' ${c[i]?'checked':''} data-s='${s.id}' data-i='${i}' onchange='tgCk(this.dataset.s,this.dataset.i,this.checked)'><span>${esc(d)}</span></label>`).join('')}${n===docs.length?`<span class='badge'>✅ أوراقك جاهزة</span>`:''}`:`<p class='mut'>لا توجد أوراق مطلوبة.</p>`}${s.notes?`<p class='note' style='margin:8px 0'>${esc(s.notes)}</p>`:''}${s.sample?`<p class='mut' style='font-size:.8rem;margin:6px 0 0'>⚠ البيانات مثال استرشادي مؤقت، تأكد من الإدارة قبل الاعتماد عليها.</p>`:''}${stu?`<div class='row' style='margin-top:10px'><select id='dy_${s.id}'>${[0,1,2].map(o=>`<option value='${dayKey(o)}'>${dayLbl(o)}</option>`).join('')}</select><button class='p' data-s='${s.id}' onclick='bookTk(this.dataset.s)'>🎫 احجز دوري</button></div>`:''}</div>`;

async function bookTk(sid){

  if(tickets.some(t=>t.uid===me.id&&t.dept===s.dept&&t.day===day&&['waiting','serving'].includes(t.status))){toast('لديك دور فعّال في '+D.n+' لنفس اليوم');return}

}
async function cancelTk(id){if(await ask('إلغاء هذا الدور؟')===null)return;try{await db.doc('tickets/'+id).update({status:'cancelled'})}catch(e){toast('تعذر الإلغاء')}}
async function setTk(id,st){

let CFG={colleges:[]},G=null,gLoad=0,gTm=null;
async function loadCfg(){const r=await api('/api/config');if(r.ok&&r.config)CFG=r.config}
async function saveCfg(){let c;try{c=JSON.parse($('#cj').value)}catch(e){toast('الصيغة غير صحيحة (JSON)');return}const r=await api('/api/admin/config',{config:c});if(r.ok){CFG=r.config;$('#cj').value=JSON.stringify(CFG,null,1);toast('تم حفظ الإعدادات ✅')}else toast(r.error||'تعذر الحفظ')}
const gc=()=>CFG.colleges.find(c=>c.id===me.college)||null;
const collegeOpts=sel=>CFG.colleges.map(c=>`<option value='${esc(c.id)}' ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
const yearOpts=(cid,sel)=>{const c=CFG.colleges.find(x=>x.id===cid)||CFG.colleges[0],n=c?c.years:4;return Array.from({length:n},(_,i)=>`<option value='${i+1}' ${+sel===i+1?'selected':''}>الفرقة ${i+1}</option>`).join('')};
function fillYears(cid,t){const e=$('#'+t);if(e)e.innerHTML=yearOpts(cid,1)}
async function saveProfile(){const r=await api('/api/profile',{college:$('#pc').value,year:+$('#py').value});if(r.ok){me={...me,...r.user,auth:true};save();toast('تم حفظ بياناتك ✅');render()}else toast(r.error||'تعذر الحفظ')}
const gpts=(sc,g)=>{const x=sc.find(t=>t.g===g);return x?x.pts:null};
const f2=v=>v==null?'—':v.toFixed(2);
const gOpts=(sc,sel,blank)=>`<option value=''>${blank}</option>`+sc.map(t=>`<option ${t.g===sel?'selected':''}>${esc(t.g)}</option>`).join('');
const gStand=(cl,v)=>{if(v==null)return '—';const x=[...cl.standings].sort((a,b)=>b.min-a.min).find(t=>v>=t.min);return x?x.label:'—'};
function gCalc(sc){
  let C=0,Q=0;const p=G.prior;if(p&&+p.credits>0){C=+p.credits;Q=C*(+p.gpa||0)}
  const rows=G.terms.map(t=>{let c=0,q=0;t.courses.forEach(x=>{const v=gpts(sc,x.grade);if(v==null||!(+x.credits>0))return;c+=+x.credits;q+=v*x.credits});C+=c;Q+=q;return{c,g:c?q/c:null,cum:C?Q/C:null}});
  return{rows,C,Q,gpa:C?Q/C:null};
}
function gPlan(cl,r){
  const sc=cl.scale,tg=+G.plan.target||0;let Cp=0,Qp=0,U=0;
  G.plan.courses.forEach(x=>{const c=+x.credits;if(!(c>0))return;if(!x.grade)U+=c;else{const v=gpts(sc,x.grade);if(v!=null){Cp+=c;Qp+=v*c}}});
  if(Cp+U===0)return `<p class='mut'>أضف مواد الفصل القادم بساعاتها المعتمدة.</p>`;
  const T=r.C+Cp+U,asc=[...sc].sort((a,b)=>a.pts-b.pts),best=asc[asc.length-1];
  if(!U){const g=(r.Q+Qp)/T;return `<p>معدلك التراكمي المتوقع: <b>${f2(g)}</b> · ${esc(gStand(cl,g))} ${g+1e-9>=tg?'<span class="badge">✅ حققت هدفك</span>':'<span class="badge b">أقل من هدفك '+f2(tg)+'</span>'}</p>`}
  const need=(tg*T-r.Q-Qp)/U;
  if(need>best.pts+1e-9){const mx=(r.Q+Qp+best.pts*U)/T;return `<p class='note'>الهدف ${f2(tg)} مش ممكن يتحقق في فصل واحد حتى لو جبت ${esc(best.g)} في المواد المطلوبة. أقصى معدل تراكمي ممكن: <b>${f2(mx)}</b>. وزّع الهدف على أكتر من فصل.</p>`}
  const ok=asc.filter(t=>t.pts>0&&t.pts>=need-1e-9).sort((a,b)=>a.pts-b.pts||a.min-b.min)[0];
  if(!ok||need<=0)return `<p>هدفك متحقق بأي تقدير ناجح في المواد المطلوبة 👍</p>`;
  return `<p>محتاج متوسط <b>${f2(need)}</b> نقطة في المواد المطلوبة (${U} ساعة)، يعني تقدير <b>${esc(ok.g)}</b> على الأقل، أي حوالي <b>${ok.min}٪</b> فأكتر.</p>`;
}
function gSave(){clearTimeout(gTm);gTm=setTimeout(async()=>{const r=await api('/api/gpa',G,'PUT');if(!r.ok)toast('تعذر حفظ بياناتك')},700)}
const gGo=()=>{gSave();render()};
function gAddTerm(){G.terms.push({name:'الفصل '+(G.terms.length+1),courses:[{name:'',credits:3,grade:''}]});gGo()}
function gDelTerm(i){G.terms.splice(i,1);gGo()}
function gTerm(i,v){G.terms[i].name=v;gGo()}
function gAddC(i){G.terms[i].courses.push({name:'',credits:3,grade:''});gGo()}
function gDelC(i,j){G.terms[i].courses.splice(j,1);gGo()}
function gSet(i,j,f,v){G.terms[i].courses[j][f]=f==='credits'?Math.max(0,Math.min(12,+v||0)):v;gGo()}
function gPrior(on){G.prior=on?{credits:0,gpa:0}:null;gGo()}
function gPriorSet(f,v){G.prior[f]=+v||0;gGo()}
function pSet(f,v){G.plan[f]=Math.max(0,Math.min(5,+v||0));gGo()}
function pAdd(){G.plan.courses.push({name:'',credits:3,grade:''});gGo()}
function pDel(j){G.plan.courses.splice(j,1);gGo()}
function pCourse(j,f,v){G.plan.courses[j][f]=f==='credits'?Math.max(0,Math.min(12,+v||0)):v;gGo()}

  h+=`<section class='hero welcome'><div class='rl'>${esc(cl.name)} · الفرقة ${me.year||'—'}</div><h1>المعدل التراكمي ${f2(r.gpa)}</h1><div class='stats'><div><b>${r.C}</b><span>ساعة معتمدة</span></div><div><b>${esc(gStand(cl,r.gpa))}</b><span>الحالة الأكاديمية</span></div></div></section>`;
  h+=`<div class='card'><div class='row sp'><h2>📘 الفصول الدراسية</h2><button onclick='gAddTerm()'>＋ فصل</button></div><label style='flex-direction:row;align-items:center;gap:8px'><input type='checkbox' ${G.prior?'checked':''} onchange='gPrior(this.checked)' style='width:auto'> عندي معدل وساعات من فصول سابقة (بدل إدخالها كلها)</label>`;
  if(G.prior)h+=`<div class='row' style='margin-top:8px'><label>الساعات السابقة<input type='number' min='0' max='300' value='${G.prior.credits}' onchange='gPriorSet("credits",this.value)'></label><label>المعدل السابق<input type='number' step='0.01' min='0' max='${mx}' value='${G.prior.gpa}' onchange='gPriorSet("gpa",this.value)'></label></div>`;
  G.terms.forEach((t,i)=>{
    h+=`<div class='slot' style='display:block;margin-top:10px'><div class='row sp'><input value='${esc(t.name)}' placeholder='اسم الفصل' onchange='gTerm(${i},this.value)'><span class='mut'>معدل الفصل ${f2(r.rows[i].g)} · تراكمي ${f2(r.rows[i].cum)}</span><button class='d' onclick='gDelTerm(${i})'>حذف الفصل</button></div>`
    +t.courses.map((x,j)=>`<div class='row' style='margin-top:6px'><input style='flex:1;min-width:120px' value='${esc(x.name)}' placeholder='المادة' onchange='gSet(${i},${j},"name",this.value)'><input type='number' min='0' max='12' step='0.5' style='width:70px' value='${x.credits}' title='الساعات المعتمدة' onchange='gSet(${i},${j},"credits",this.value)'><select onchange='gSet(${i},${j},"grade",this.value)'>${gOpts(sc,x.grade,'التقدير')}</select><button class='d' onclick='gDelC(${i},${j})'>✕</button></div>`).join('')
    +`<button style='margin-top:8px' onclick='gAddC(${i})'>＋ مادة</button></div>`;
  });
  if(!G.terms.length)h+=`<div class='empty'>اضغط «＋ فصل» وابدأ بإدخال موادك.</div>`;
  h+=`</div><div class='card'><h2>🎯 تخطيط الفصل القادم</h2><p class='mut'>أضف مواد الفصل القادم، وسيب التقدير «؟ المطلوب» للمادة (أو المواد) اللي عايز تعرف محتاج تجيب فيها كام، وحدد المعدل التراكمي المستهدف.</p><div class='row'><label>المعدل التراكمي المستهدف<input type='number' step='0.01' min='0' max='${mx}' value='${G.plan.target}' onchange='pSet("target",this.value)'></label></div>`
  +G.plan.courses.map((x,j)=>`<div class='row' style='margin-top:6px'><input style='flex:1;min-width:120px' value='${esc(x.name)}' placeholder='المادة' onchange='pCourse(${j},"name",this.value)'><input type='number' min='0' max='12' step='0.5' style='width:70px' value='${x.credits}' title='الساعات المعتمدة' onchange='pCourse(${j},"credits",this.value)'><select onchange='pCourse(${j},"grade",this.value)'>${gOpts(sc,x.grade,'؟ المطلوب')}</select><button class='d' onclick='pDel(${j})'>✕</button></div>`).join('')
  +`<button style='margin-top:8px' onclick='pAdd()'>＋ مادة</button><div style='margin-top:12px'>${gPlan(cl,r)}</div></div>`;
  return h;
}
render();init();
</script>
</body>
</html>
